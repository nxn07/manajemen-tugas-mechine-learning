;;;;;;;;;;;;;;;;;;;;;
; Optimized PHP-FPM Configuration
;;;;;;;;;;;;;;;;;;;;;

[www]
; Process management - dynamic pool for efficiency
pm = dynamic
pm.max_children = 25        ; Reduced from 50 to prevent memory overload
pm.start_servers = 5        ; Start with only 5 workers
pm.min_spare_servers = 3    ; Keep minimum 3 alive
pm.max_spare_servers = 10   ; Cap idle at 10
pm.max_requests = 500       ; Recycle worker after requests

; Performance optimization
request_terminate_timeout = 60s
fastcgi_buffer_size = 4k
fastcgi_buffers = 8 4k
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1

; Faster connection handling
listen = 9000
listen.backlog = 2048
listen.allowed_clients = 127.0.0.1
fastcgi.impersonate = 1
fastcgi.connect_timeout = 5s
fastcgi.read.timeout = 30s

; Logging (don't log every request in production)
catch_workers_output = yes
decorate_workers_output = no
log_level = error

; Security settings
security.limit_extensions = .php

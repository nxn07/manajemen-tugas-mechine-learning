;;;;;;;;;;;;;;;;;;
; PHP Configuration
; Optimized for ML Clustering Operations
;;;;;;;;;;;;;;;;;;

[PHP]
; Increase execution time for ML operations
max_execution_time = 600
memory_limit = 512M

; Increase file upload limits if needed
upload_max_filesize = 100M
post_max_size = 100M

[Date]
; Set timezone
date.timezone = "Asia/Jakarta"

[Assertion]
; Disable assertions in production
assert.active = 0

[Session]
; Session timeout (5 hours)
session.gc_maxlifetime = 18000

; File-based session for better performance in containerized environment
session.save_handler = files
session.save_path = "/var/www/storage/framework/sessions"

[TCP]
; TCP connection timeout
default_socket_timeout = 60

[curl]
; CURL timeout settings
curl.cainfo = /etc/ssl/certs/ca-certificates.crt

[filter]
; URL encoding
url_rewriter.tags = ""

[mbstring]
; Enable multibyte string support
mbstring.language = Neutral
mbstring.func_overload = 0
mbstring.internal_encoding = UTF-8

[openssl]
; OpenSSL cipher settings
openssl.cafile = /etc/ssl/certs/ca-certificates.crt

; Increase fpm timeout for slow requests
pm.max_requests = 500

[opcache]
; Enable opcache for better performance
opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
opcache.revalidate_freq = 60
opcache.validate_timestamps = 1

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <!-- Background -->
  <rect width="1200" height="900" fill="#1a1a2e"/>
  
  <!-- Title -->
  <text x="600" y="40" font-family="Arial, sans-serif" font-size="24" fill="#00d9ff" text-anchor="middle" font-weight="bold">
    SIM-KAP ML Clustering Architecture
  </text>
  
  <!-- Frontend Layer -->
  <g id="frontend-layer">
    <rect x="50" y="100" width="200" height="700" rx="10" fill="#0f3460" stroke="#00d9ff" stroke-width="2"/>
    <text x="150" y="130" font-family="Arial" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="bold">FRONTEND</text>
    <text x="150" y="150" font-family="Arial" font-size="14" fill="#00d9ff" text-anchor="middle">Next.js (Port 3000)</text>
    
    <!-- Components inside frontend -->
    <rect x="70" y="180" width="160" height="50" rx="5" fill="#16213e" stroke="#e94560" stroke-width="1"/>
    <text x="150" y="205" font-family="Arial" font-size="12" fill="#ffffff" text-anchor="middle">User Management UI</text>
    
    <rect x="70" y="240" width="160" height="50" rx="5" fill="#16213e" stroke="#e94560" stroke-width="1"/>
    <text x="150" y="265" font-family="Arial" font-size="12" fill="#ffffff" text-anchor="middle">KPI Criteria UI</text>
    
    <rect x="70" y="300" width="160" height="50" rx="5" fill="#16213e" stroke="#e94560" stroke-width="1"/>
    <text x="150" y="325" font-family="Arial" font-size="12" fill="#ffffff" text-anchor="middle">ML Clustering UI</text>
    
    <rect x="70" y="360" width="160" height="50" rx="5" fill="#16213e" stroke="#e94560" stroke-width="1"/>
    <text x="150" y="385" font-family="Arial" font-size="12" fill="#ffffff" text-anchor="middle">API Client (axios)</text>
    
    <rect x="70" y="420" width="160" height="50" rx="5" fill="#16213e" stroke="#e94560" stroke-width="1"/>
    <text x="150" y="445" font-family="Arial" font-size="12" fill="#ffffff" text-anchor="middle">Token Storage</text>
    
    <!-- Icons for frontend services -->
    <circle cx="120" cy="520" r="15" fill="#16213e" stroke="#00d9ff" stroke-width="2"/>
    <text x="120" y="525" font-family="Arial" font-size="10" fill="#00d9ff" text-anchor="middle">📦</text>
    <text x="150" y="525" font-family="Arial" font-size="10" fill="#ffffff">Response Cache</text>
  </g>
  
  <!-- Backend Layer -->
  <g id="backend-layer">
    <rect x="400" y="100" width="400" height="700" rx="10" fill="#0f3460" stroke="#00d9ff" stroke-width="2"/>
    <text x="600" y="130" font-family="Arial" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="bold">BACKEND (LARAVEL)</text>
    <text x="600" y="150" font-family="Arial" font-size="14" fill="#00d9ff" text-anchor="middle">PHP-FPM (Port 8000)</text>
    
    <!-- API Routes -->
    <rect x="420" y="180" width="360" height="60" rx="5" fill="#16213e" stroke="#e94560" stroke-width="1"/>
    <text x="600" y="200" font-family="Arial" font-size="12" fill="#ffffff" text-anchor="middle">RESTful API Endpoints</text>
    <text x="600" y="215" font-family="Arial" font-size="11" fill="#00d9ff" text-anchor="middle">/api/v1/users | /api/v1/kpis | /api/v1/ml/*</text>
    
    <!-- Controllers -->
    <rect x="420" y="250" width="360" height="60" rx="5" fill="#16213e" stroke="#00d9ff" stroke-width="1"/>
    <text x="600" y="270" font-family="Arial" font-size="12" fill="#ffffff" text-anchor="middle">Controllers</text>
    <text x="600" y="285" font-family="Arial" font-size="11" fill="#00d9ff" text-anchor="middle">UserController • MlClusteringController</text>
    
    <!-- Services -->
    <rect x="420" y="320" width="360" height="60" rx="5" fill="#16213e" stroke="#00d9ff" stroke-width="1"/>
    <text x="600" y="340" font-family="Arial" font-size="12" fill="#ffffff" text-anchor="middle">Service Layer</text>
    <text x="600" y="355" font-family="Arial" font-size="11" fill="#00d9ff" text-anchor="middle">UserService • FeatureExtractionService</text>
    
    <!-- Repositories/Models -->
    <rect x="420" y="390" width="360" height="60" rx="5" fill="#16213e" stroke="#e94560" stroke-width="1"/>
    <text x="600" y="410" font-family="Arial" font-size="12" fill="#ffffff" text-anchor="middle">Models &amp; Eloquent ORM</text>
    <text x="600" y="425" font-family="Arial" font-size="11" fill="#00d9ff" text-anchor="middle">Employee • Task • PerformanceEvaluation</text>
    
    <!-- Cache -->
    <rect x="420" y="460" width="360" height="60" rx="5" fill="#16213e" stroke="#00d9ff" stroke-width="1"/>
    <text x="600" y="480" font-family="Arial" font-size="12" fill="#ffffff" text-anchor="middle">Cache Manager</text>
    <text x="600" y="495" font-family="Arial" font-size="11" fill="#00d9ff" text-anchor="middle">Redis Connection</text>
    
    <!-- Queue -->
    <rect x="420" y="530" width="360" height="60" rx="5" fill="#16213e" stroke="#00d9ff" stroke-width="1"/>
    <text x="600" y="550" font-family="Arial" font-size="12" fill="#ffffff" text-anchor="middle">Queue Worker</text>
    <text x="600" y="565" font-family="Arial" font-size="11" fill="#00d9ff" text-anchor="middle">php artisan queue:work</text>
    
    <!-- Middleware -->
    <rect x="420" y="600" width="360" height="60" rx="5" fill="#16213e" stroke="#e94560" stroke-width="1"/>
    <text x="600" y="620" font-family="Arial" font-size="12" fill="#ffffff" text-anchor="middle">Middleware</text>
    <text x="600" y="635" font-family="Arial" font-size="11" fill="#00d9ff" text-anchor="middle">Auth • CORS • RequestTiming</text>
    
    <!-- Health Check -->
    <rect x="420" y="670" width="360" height="60" rx="5" fill="#16213e" stroke="#00d9ff" stroke-width="1"/>
    <text x="600" y="690" font-family="Arial" font-size="12" fill="#ffffff" text-anchor="middle">Health Endpoint</text>
    <text x="600" y="705" font-family="Arial" font-size="11" fill="#00d9ff" text-anchor="middle">GET /api/v1/health</text>
  </g>
  
  <!-- ML Service Layer -->
  <g id="ml-layer">
    <rect x="850" y="100" width="300" height="700" rx="10" fill="#0f3460" stroke="#00ff00" stroke-width="2"/>
    <text x="1000" y="130" font-family="Arial" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="bold">ML PYTHON SERVICE</text>
    <text x="1000" y="150" font-family="Arial" font-size="14" fill="#00ff00" text-anchor="middle">Python 3.11 (Container)</text>
    
    <!-- Scripts -->
    <rect x="870" y="180" width="260" height="60" rx="5" fill="#16213e" stroke="#00ff00" stroke-width="1"/>
    <text x="1000" y="200" font-family="Arial" font-size="12" fill="#ffffff" text-anchor="middle">ml_processor.py</text>
    <text x="1000" y="215" font-family="Arial" font-size="11" fill="#00ff00" text-anchor="middle">K-Means Clustering Algorithm</text>
    
    <!-- Libraries -->
    <rect x="870" y="250" width="260" height="60" rx="5" fill="#16213e" stroke="#00ff00" stroke-width="1"/>
    <text x="1000" y="270" font-family="Arial" font-size="12" fill="#ffffff" text-anchor="middle">Libraries</text>
    <text x="1000" y="285" font-family="Arial" font-size="11" fill="#00ff00" text-anchor="middle">scikit-learn • NumPy • Pandas • SciPy</text>
    
    <!-- Features -->
    <rect x="870" y="320" width="260" height="60" rx="5" fill="#16213e" stroke="#00ff00" stroke-width="1"/>
    <text x="1000" y="340" font-family="Arial" font-size="12" fill="#ffffff" text-anchor="middle">Feature Extraction</text>
    <text x="1000" y="355" font-family="Arial" font-size="11" fill="#00ff00" text-anchor="middle">tasks_completed, on_time%, quality_score</text>
    
    <!-- Clustering -->
    <rect x="870" y="390" width="260" height="60" rx="5" fill="#16213e" stroke="#00ff00" stroke-width="1"/>
    <text x="1000" y="410" font-family="Arial" font-size="12" fill="#ffffff" text-anchor="middle">Clustering Execution</text>
    <text x="1000" y="425" font-family="Arial" font-size="11" fill="#00ff00" text-anchor="middle">MiniBatchKMeans / KMeans</text>
    
    <!-- Outputs -->
    <rect x="870" y="460" width="260" height="60" rx="5" fill="#16213e" stroke="#00ff00" stroke-width="1"/>
    <text x="1000" y="480" font-family="Arial" font-size="12" fill="#ffffff" text-anchor="middle">Outputs</text>
    <text x="1000" y="495" font-family="Arial" font-size="11" fill="#00ff00" text-anchor="middle">centroids, cluster_assignments, silhouette_score</text>
    
    <!-- Venv -->
    <rect x="870" y="530" width="260" height="60" rx="5" fill="#16213e" stroke="#00ff00" stroke-width="1"/>
    <text x="1000" y="550" font-family="Arial" font-size="12" fill="#ffffff" text-anchor="middle">Virtual Environment</text>
    <text x="1000" y="565" font-family="Arial" font-size="11" fill="#00ff00" text-anchor="middle">/app/backend/python/venv</text>
    
    <!-- Volume -->
    <rect x="870" y="600" width="260" height="60" rx="5" fill="#16213e" stroke="#00ff00" stroke-width="1"/>
    <text x="1000" y="620" font-family="Arial" font-size="12" fill="#ffffff" text-anchor="middle">Shared Volume</text>
    <text x="1000" y="635" font-family="Arial" font-size="11" fill="#00ff00" text-anchor="middle">storage/app/ml_input*.json</text>
  </g>
  
  <!-- Database Layer -->
  <g id="database-layer">
    <rect x="50" y="850" width="1100" height="100" rx="10" fill="#0f3460" stroke="#ff00ff" stroke-width="2"/>
    <text x="600" y="880" font-family="Arial" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="bold">DATA LAYER</text>
    
    <!-- PostgreSQL -->
    <ellipse cx="350" cy="900" rx="120" ry="40" fill="#16213e" stroke="#ffd700" stroke-width="2"/>
    <text x="350" y="895" font-family="Arial" font-size="14" fill="#ffffff" text-anchor="middle">PostgreSQL 16</text>
    <text x="350" y="915" font-family="Arial" font-size="11" fill="#ffd700" text-anchor="middle">Port 5432 • sim_kinerja DB</text>
    
    <!-- Tables -->
    <rect x="300" y="925" width="100" height="20" rx="3" fill="#1a1a2e" stroke="#ffd700" stroke-width="1"/>
    <text x="350" y="940" font-family="Arial" font-size="9" fill="#ffffff" text-anchor="middle">employees</text>
    
    <rect x="400" y="925" width="100" height="20" rx="3" fill="#1a1a2e" stroke="#ffd700" stroke-width="1"/>
    <text x="450" y="940" font-family="Arial" font-size="9" fill="#ffffff" text-anchor="middle">tasks</text>
    
    <rect x="500" y="925" width="100" height="20" rx="3" fill="#1a1a2e" stroke="#ffd700" stroke-width="1"/>
    <text x="550" y="940" font-family="Arial" font-size="9" fill="#ffffff" text-anchor="middle">evaluations</text>
    
    <rect x="600" y="925" width="100" height="20" rx="3" fill="#1a1a2e" stroke="#ffd700" stroke-width="1"/>
    <text x="650" y="940" font-family="Arial" font-size="9" fill="#ffffff" text-anchor="middle">ml_features</text>
    
    <rect x="700" y="925" width="100" height="20" rx="3" fill="#1a1a2e" stroke="#ffd700" stroke-width="1"/>
    <text x="750" y="940" font-family="Arial" font-size="9" fill="#ffffff" text-anchor="middle">clusters</text>
    
    <!-- Redis -->
    <ellipse cx="850" cy="900" rx="120" ry="40" fill="#16213e" stroke="#00bfff" stroke-width="2"/>
    <text x="850" y="895" font-family="Arial" font-size="14" fill="#ffffff" text-anchor="middle">Redis Cache</text>
    <text x="850" y="915" font-family="Arial" font-size="11" fill="#00bfff" text-anchor="middle">Port 6379 • Cache &amp; Queue</text>
  </g>
  
  <!-- Arrows showing data flow -->
  <!-- Frontend → Backend -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00ff00"/>
    </marker>
  </defs>
  
  <!-- Request arrows -->
  <line x1="250" y1="200" x2="400" y2="200" stroke="#00ff00" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="325" y="190" font-family="Arial" font-size="10" fill="#00ff00">GET/POST Requests</text>
  
  <line x1="250" y1="260" x2="400" y2="260" stroke="#00ff00" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="325" y="250" font-family="Arial" font-size="10" fill="#00ff00">GET Users</text>
  
  <line x1="250" y1="320" x2="400" y2="320" stroke="#00ff00" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="325" y="310" font-family="Arial" font-size="10" fill="#00ff00">GET KPIs</text>
  
  <line x1="250" y1="380" x2="400" y2="380" stroke="#00ff00" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="325" y="370" font-family="Arial" font-size="10" fill="#00ff00">POST /ml/extract-features</text>
  
  <!-- Backend → ML Service -->
  <line x1="800" y1="400" x2="850" y2="400" stroke="#ff00ff" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="825" y="390" font-family="Arial" font-size="10" fill="#ff00ff">Input JSON</text>
  
  <line x1="800" y1="480" x2="850" y2="480" stroke="#ff00ff" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="825" y="470" font-family="Arial" font-size="10" fill="#ff00ff">ML Input File</text>
  
  <!-- ML Service → Backend -->
  <line x1="850" y1="440" x2="800" y2="440" stroke="#ffff00" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="825" y="430" font-family="Arial" font-size="10" fill="#ffff00">Output Results</text>
  
  <!-- Backend → Database -->
  <line x1="520" y1="550" x2="450" y2="700" stroke="#ff0000" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="450" y1="700" x2="400" y2="850" stroke="#ff0000" stroke-width="2"/>
  <text x="470" y="650" font-family="Arial" font-size="10" fill="#ff0000">Eloquent ORM</text>
  
  <!-- Frontend ← Backend Response -->
  <line x1="400" y1="200" x2="250" y2="200" stroke="#00ff00" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="325" y="220" font-family="Arial" font-size="10" fill="#00ff00">JSON Response</text>
  
  <!-- Labels -->
  <text x="150" y="950" font-family="Arial" font-size="12" fill="#ffffff">Frontend Port: 3000</text>
  <text x="600" y="950" font-family="Arial" font-size="12" fill="#ffffff">Backend Port: 8000</text>
  <text x="1000" y="950" font-family="Arial" font-size="12" fill="#ffffff">ML Container</text>
  
  <!-- Legend -->
  <rect x="850" y="700" width="340" height="130" rx="10" fill="#1a1a2e" stroke="#00d9ff" stroke-width="2"/>
  <text x="1020" y="720" font-family="Arial" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Legend</text>
  
  <circle cx="900" cy="740" r="6" fill="#00ff00"/>
  <text x="915" y="745" font-family="Arial" font-size="11" fill="#ffffff">HTTP/HTTPS Requests</text>
  
  <circle cx="900" cy="765" r="6" fill="#ff00ff"/>
  <text x="915" y="770" font-family="Arial" font-size="11" fill="#ffffff">File Exchange</text>
  
  <circle cx="900" cy="790" r="6" fill="#ffff00"/>
  <text x="915" y="795" font-family="Arial" font-size="11" fill="#ffffff">Data Transfer</text>
  
  <circle cx="900" cy="815" r="6" fill="#ff0000" stroke-dasharray="3,2"/>
  <text x="915" y="820" font-family="Arial" font-size="11" fill="#ffffff">Database Connection</text>
  
</svg>

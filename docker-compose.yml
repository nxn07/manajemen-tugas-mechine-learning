version: '3.8'

services:
  # 1. Database PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: simkap_postgres
    restart: always
    environment:
      POSTGRES_DB: sim_kinerja
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Redis Cache & Queue
  redis:
    image: redis:alpine
    container_name: simkap_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # 3. Backend Laravel (API Server)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: simkap_backend
    restart: always
    ports:
      - "0.0.0.0:8000:8000"
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: sim_kinerja
      DB_USERNAME: postgres
      DB_PASSWORD: postgrespassword
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      ML_PYTHON_URL: ml-python:8000
    volumes:
      - ./backend:/var/www
    depends_on:
      - postgres
      - redis
      - ml-python

  # 4. Queue Worker (Otomatis memproses antrean di background)
  queue_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: simkap_queue_worker
    restart: always
    command: php artisan queue:work --tries=3 --timeout=90
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: sim_kinerja
      DB_USERNAME: postgres
      DB_PASSWORD: postgrespassword
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
    volumes:
      - ./backend:/var/www
    depends_on:
      - backend
      - redis
      - postgres
      - ml-python

  # 5. Frontend Next.js (Fast Refresh & Polling Activated for Instant Ctrl+R)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: simkap_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  # 6. Machine Learning Python Service (Dedicated & Separated)
  ml-python:
    image: python:3.11-slim
    container_name: simkap_ml_python
    restart: always
    working_dir: /app
    volumes:
      - ./machine_learning:/app/machine_learning
      - ./backend:/app/backend
      - ml_python_venv:/app/backend/python/venv
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: "/app:/app/machine_learning:/app/backend"
      ML_SERVICE_URL: "http://backend:8000/api/v1"
    command: >
      bash -c "
        apt-get update && apt-get install -y --no-install-recommends gcc g++ make python3-dev &&
        python3 -m venv /app/backend/python/venv &&
        /app/backend/python/venv/bin/pip install --upgrade pip &&
        /app/backend/python/venv/bin/pip install scikit-learn numpy pandas scipy joblib &&
        echo '=== ML Python Service Ready ===' &&
        echo 'Python version:' && /app/backend/python/venv/bin/python --version &&
        echo 'Installed packages:' && /app/backend/python/venv/bin/pip freeze | grep -E 'scikit-learn|numpy|pandas|scipy' &&
        echo 'Service running in background, ready for ML operations...' &&
        echo 'Maximum execution time: 300 seconds (5 minutes)' &&
        ulimit -t 300 &&
        tail -f /dev/null
      "
    healthcheck:
      test: ["CMD-SHELL", "/app/backend/python/venv/bin/python --version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G

networks:
  simkap_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  ml_python_venv:
